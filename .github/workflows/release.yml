name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate and derive release metadata
        id: release
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install ODBC headers
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends unixodbc-dev

      - name: Test
        run: go test -race ./... && go vet ./...

      - name: Build Linux amd64 archive
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
          BUILD_DATE: ${{ steps.release.outputs.build_date }}
        run: |
          package="prometheus-informix-exporter_${VERSION}_linux_amd64"
          mkdir -p "dist/${package}/examples" "dist/${package}/docs"
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build \
            -trimpath \
            -ldflags "-s -w \
              -X github.com/anmartsan/prometheus-informix-exporter/internal/version.Version=${VERSION} \
              -X github.com/anmartsan/prometheus-informix-exporter/internal/version.Commit=${COMMIT} \
              -X github.com/anmartsan/prometheus-informix-exporter/internal/version.BuildDate=${BUILD_DATE}" \
            -o "dist/${package}/informix_exporter" \
            ./cmd/informix_exporter
          cp README.md LICENSE "dist/${package}/"
          cp docs/metrics.md "dist/${package}/docs/"
          cp examples/config.yaml examples/odbc.ini examples/odbc.secrets.ini examples/sqlhosts \
            examples/config.multi-instance.yaml examples/odbc.multi-instance.ini \
            examples/odbc.multi-instance.secrets.ini examples/sqlhosts.multi-instance \
            examples/alertmanager.yml examples/alertmanager.webhook.yml \
            "dist/${package}/examples/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          rm -rf "dist/${package}"
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:latest
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            COMMIT=${{ steps.release.outputs.commit }}
            BUILD_DATE=${{ steps.release.outputs.build_date }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.commit }}
            org.opencontainers.image.created=${{ steps.release.outputs.build_date }}
          sbom: true
          provenance: mode=max

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/checksums.txt \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi
