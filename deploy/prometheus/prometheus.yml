global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: informix
    metrics_path: /metrics/fast
    scrape_interval: 1m
    scrape_timeout: 10s
    static_configs:
      - targets:
          - informix-exporter:8080

  - job_name: informix-storage
    metrics_path: /metrics/storage
    # The exporter refreshes these database queries every two hours and serves
    # the cached snapshot between refreshes, so data is present immediately.
    scrape_interval: 1m
    scrape_timeout: 10s
    static_configs:
      - targets:
          - informix-exporter:8080
    # Connectivity and process metrics come from the fast job. Keep only the
    # slow collector telemetry and storage/table metrics from this endpoint.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'informix_up|informix_exporter_(build_info|scrape_.*|last_.*|instance_.*)'
        action: drop

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
